<!doctype html>
<html lang="en" data-showcase-state="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Genesis</title>
  </head>
  <body>
    <main id="showcase-root">
      <canvas id="showcase-canvas" aria-label="Cosmic Genesis interactive scene"></canvas>
      <picture class="showcase-fallback">
        <img src="/showcase/fallback.png" alt="Cosmic Genesis abstract artwork" />
      </picture>
      <p class="showcase-status" role="status" aria-live="polite">Preparing Cosmic Genesis…</p>
      <section class="showcase-controls" aria-label="Showcase controls">
        <p class="interaction-hint">Drag to orbit · Scroll to zoom · Click or tap to pulse</p>
        <button type="button" data-reset-view>Reset view</button>
      </section>
      <aside class="particle-lab" aria-label="Particle Lab controls">
        <header class="particle-lab__header">
          <strong>Particle Lab</strong>
          <output class="particle-lab__fps" data-fps aria-live="off">-- FPS</output>
          <button class="particle-lab__toggle" type="button" data-panel-toggle aria-label="Toggle Particle Lab">⌃</button>
        </header>
        <div class="particle-lab__body" data-panel-body></div>
        <button class="particle-lab__reset" type="button" data-parameter-reset>Reset parameters</button>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
