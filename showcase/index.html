<!doctype html>
<html lang="en" data-showcase-state="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Genesis</title>
  </head>
  <body>
    <main id="showcase-root">
      <canvas id="showcase-canvas" aria-label="Cosmic Genesis interactive scene"></canvas>
      <picture class="showcase-fallback">
        <img src="/showcase/fallback.png" alt="Cosmic Genesis abstract artwork" />
      </picture>
      <p class="showcase-status" role="status" aria-live="polite">Preparing Cosmic Genesis…</p>
      <section class="showcase-controls" aria-label="Showcase controls">
        <p class="interaction-hint">Drag to explore · Scroll to drift</p>
        <label>
          Quality
          <select aria-label="Rendering quality">
            <option value="auto">Auto</option>
            <option value="ultra">Ultra</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <button type="button">Reset view</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
